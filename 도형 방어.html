<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도형 방어</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#E9EDF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/도형 방어-Bf_xmy6x.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/도형 방어-D3nn0qh5.css">
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="hud-top">
      <div class="hp" aria-label="체력">
        <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
        <span id="hpText">20</span>
      </div>
      <button class="speed-btn" id="speedBtn" aria-pressed="false" aria-label="1배속">1×</button>
      <button class="speed-btn gear-btn" id="gearBtn" aria-label="설정">⚙</button>
    </div>
    <div class="hud-info">
      <div class="stat" aria-label="골드"><span class="coin"></span><span id="gold">0</span></div>
      <div class="stat" id="wave">웨이브 1</div>
      <div class="stat dim" id="time" aria-label="버틴 시간">0:00</div>
    </div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="startOv">
      <h1>도형 방어</h1>
      <p>사방에서 다가오는 도형을 원 안에서 자동으로 공격합니다. 골드로 능력치를 올리고, 웨이브를 넘길 때마다 카드 3장 중 1장을 골라 스킬을 모으세요. 200웨이브를 버티면 승리합니다.</p>
      <div class="btn-row">
        <button class="btn-main" id="startBtn">시작</button>
      </div>
    </div>
    <div class="overlay hidden" id="overOv">
      <h2 id="overTitle">방어 실패</h2>
      <p id="overStats"></p>
      <p class="auto-msg hidden" id="autoMsg"></p>
      <div class="reward">
        <div><span>도달 웨이브</span><span id="rWave">0</span></div>
        <div><span>처치</span><span id="rKills">0</span></div>
        <div><span>보스 처치</span><span id="rBoss">0</span></div>
        <div><span>고른 카드</span><span id="rCards">0</span></div>
      </div>
      <div class="rank hidden" id="rankBox">
        <form class="rank-form" id="rankForm" novalidate>
          <input id="rankName" maxlength="12" placeholder="닉네임" autocomplete="off" enterkeyhint="send" aria-label="닉네임" aria-describedby="rankNote">
          <button class="btn-sub" id="rankSubmit" type="submit">랭킹 등록</button>
        </form>
        <p class="rank-note" id="rankNote" aria-live="polite">닉네임은 공개돼요. 실명이나 연락처는 넣지 마세요.</p>
        <ol class="rank-list" id="rankList" aria-label="랭킹"></ol>
        <p class="rank-me" id="rankMe"></p>
      </div>
      <div class="btn-row">
        <button class="btn-main" id="retryBtn">다시 하기</button>
      </div>
    </div>
    <div class="overlay hidden" id="cardOv" role="dialog" aria-labelledby="cardTitle">
      <h2 id="cardTitle">웨이브 돌파</h2>
      <p>카드 1장을 고르세요. 이번 판 동안 유지됩니다.</p>
      <div class="cards" id="cards"></div>
    </div>
    <div class="overlay hidden" id="settingsOv" role="dialog" aria-label="설정">
      <h2>설정</h2>
      <div class="metas">
        <div class="set-row"><b>배경음악</b><button class="set-toggle" id="soundBtn" aria-pressed="true">켜짐</button></div>
        <div class="set-row"><b>자동 게임시작</b><button class="set-toggle" id="autoBtn" aria-pressed="false">꺼짐</button></div>
        <button class="btn-sub set-giveup" id="giveupBtn">포기하고 로비로</button>
      </div>
      <button class="btn-sub" id="settingsClose">닫기</button>
    </div>
  </main>

  <footer class="shop">
    <button class="up" data-k="range">
      <span class="u-name">범위</span><span class="u-val" id="v-range"></span>
      <span class="u-cost"><i class="coin"></i><span id="c-range"></span></span>
    </button>
    <button class="up" data-k="speed">
      <span class="u-name">공격속도</span><span class="u-val" id="v-speed"></span>
      <span class="u-cost"><i class="coin"></i><span id="c-speed"></span></span>
    </button>
    <button class="up" data-k="damage">
      <span class="u-name">공격력</span><span class="u-val" id="v-damage"></span>
      <span class="u-cost"><i class="coin"></i><span id="c-damage"></span></span>
    </button>
    <button class="up" data-k="crit">
      <span class="u-name">치명 확률</span><span class="u-val" id="v-crit"></span>
      <span class="u-cost"><i class="coin"></i><span id="c-crit"></span></span>
    </button>
    <button class="up" data-k="critDmg">
      <span class="u-name">치명 피해</span><span class="u-val" id="v-critDmg"></span>
      <span class="u-cost"><i class="coin"></i><span id="c-critDmg"></span></span>
    </button>
  </footer>
</div>

</body>
</html>
